      Inline critical CSS to eliminate render-blocking:
      Sets bg-color + font immediately before any CSS loads.
      This prevents the white flash and reduces CLS.
    -->

      html{font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

    </style>
